<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дигитална класна стая | Фатме Мехмед</title><style>
:root{--bg:#f5f6fa;--paper:#fff;--text:#192137;--muted:#687087;--line:#e3e7ee;--accent:#6357dd;--soft:#eeecff}*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--text)}body.dark{--bg:#131725;--paper:#1d2234;--text:#eef0ff;--muted:#abb3cf;--line:#343a51;--soft:#30294b}button,input{font:inherit}button,a{touch-action:manipulation}a{color:inherit}button{cursor:pointer}header{background:var(--paper);border-bottom:1px solid var(--line)}.bar{max-width:1280px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:20px 34px;gap:16px}.brand{text-decoration:none;font-weight:800;font-size:19px;display:flex;gap:12px;align-items:center}.logo{background:var(--accent);color:white;padding:7px 12px;border-radius:12px;font-family:monospace}.sub{font-size:12px;color:var(--muted);font-weight:500}.icon{border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--text);padding:8px 12px}.shell{max-width:1280px;margin:auto;display:grid;grid-template-columns:220px 1fr;gap:42px;padding:34px}aside{position:sticky;top:25px;align-self:start}.label{font-size:11px;letter-spacing:1.5px;font-weight:800;color:var(--muted);margin:18px 12px 12px}nav{display:grid;gap:7px}nav button{border:0;background:none;text-align:left;padding:12px 15px;border-radius:10px;color:var(--muted);display:flex;justify-content:space-between}nav button.active{background:var(--soft);color:var(--accent);font-weight:750}.aside-note{margin-top:34px;padding:18px;border:1px solid var(--line);border-radius:14px;font-size:13px;color:var(--muted)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--accent)}h1{font-size:clamp(30px,4vw,47px);line-height:1.16;margin:16px 0}p{color:var(--muted)}.hero{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:38px;position:relative;overflow:hidden}.hero p{max-width:570px;margin-bottom:24px}.pill{display:inline-block;background:var(--soft);color:var(--accent);font-size:12px;padding:5px 10px;border-radius:7px;margin-right:7px}.hero-art{float:right;font:700 65px/1.2 monospace;color:var(--accent);transform:rotate(-8deg);margin:10px 0 10px 20px;opacity:.7}.section-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:28px 0 17px}h2{font-size:22px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.class-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;text-decoration:none;transition:.2s}.class-card:hover{transform:translateY(-3px);border-color:var(--accent)}.grade{display:inline-flex;width:47px;height:47px;align-items:center;justify-content:center;background:var(--soft);color:var(--accent);font-size:23px;font-weight:800;border-radius:12px}.class-card h3{font-size:19px;margin:15px 0 4px}.class-card p{font-size:13px;min-height:42px;margin:0 0 19px}.card-bottom{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}.arrow{color:var(--accent);font-size:19px}.search{border:1px solid var(--line);background:var(--paper);padding:11px 15px;border-radius:10px;color:var(--text);width:min(100%,340px)}.lesson{background:var(--paper);border:1px solid var(--line);border-radius:13px;margin:12px 0;overflow:hidden}.lesson summary{cursor:pointer;padding:20px;list-style:none;display:flex;align-items:center;gap:16px}.lesson summary::after{content:'＋';margin-left:auto;color:var(--accent)}.lesson[open] summary::after{content:'−'}.number{font-size:13px;color:var(--accent);font-weight:800}.lesson small{display:block;color:var(--muted);font-size:12px}.content{border-top:1px solid var(--line);padding:8px 25px 23px}.content h4{margin-bottom:5px}.content li{margin:8px 0}.download{background:var(--soft);color:var(--accent);display:inline-block;text-decoration:none;border-radius:9px;padding:9px 13px;font-size:13px;font-weight:650}.notice{font-size:13px;border-left:3px solid var(--accent);padding:12px 16px;background:var(--soft);margin-top:25px}.empty{padding:30px;text-align:center;color:var(--muted)}footer{border-top:1px solid var(--line);margin-top:35px;padding:20px 0;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:15px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #a49aff;outline-offset:3px}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.shell{gap:24px;grid-template-columns:170px 1fr;padding:24px}.hero{padding:28px}.hero-art{display:none}}@media(max-width:650px){.shell{display:block;padding:18px}aside{position:static}nav{display:flex;overflow:auto;margin-bottom:20px}nav button{white-space:nowrap}.label,.aside-note{display:none}.bar{padding:15px 18px}.brand{font-size:15px}.grid{gap:12px}.class-card{padding:18px}.section-head{align-items:flex-start;flex-direction:column;gap:12px}.hero{padding:24px}footer{flex-direction:column}.sub{font-size:10px}}
</style><header><div class="bar"><a href="#home" class="brand"><span class="logo">&lt;/&gt;</span><span>Дигитална класна стая<div class="sub">КМИТ · Информационни технологии · Програмиране</div></span></a><button class="icon" id="theme" aria-label="Промени цветова тема">◐</button></div></header><div class="shell"><aside><div class="label">УЧЕБНО ПРОСТРАНСТВО</div><nav id="nav"></nav><div class="aside-note"><strong>Учим чрез практика.</strong><br>Малки стъпки, смели идеи и решения, които създаваме сами.</div></aside><main id="main"></main></div><script>
const subjects={5:'Компютърно моделиране и ИТ',6:'Компютърно моделиране и ИТ',7:'Компютърно моделиране и ИТ',8:'Информационни технологии',9:'ИТ и програмиране',10:'ИТ и професионална подготовка'};
const descriptions={5:'Първи проекти, дигитални умения и Scratch.',6:'Информация, документи и алгоритми.',7:'Дигитални проекти и работа с данни.',8:'Компютърни системи и дигитално съдържание.',9:'Информационни технологии и задачи с C#.',10:'Данни, софтуер и практически проекти.'};
const lessons={5:[['Машината компютър','Основни устройства и тяхното предназначение','Посочи входни, изходни и запаметяващи устройства.','Направи таблица с три колони: устройство, вид и предназначение. Включи клавиатура, мишка, монитор, принтер и флаш памет.','Добави още две устройства и обясни за какво ги използваш.'],['История в Scratch','Последователност от команди','Създай кратка анимация с начало и край.','Избери фон и два героя. При натискане на зеленото знаме първият герой поздравява, а вторият отговаря след изчакване.','Добави движение и промяна на костюм.']],6:[['Информация и мерни единици','Упражнение','Сравнявай обеми на файлове и преобразувай мерни единици.','За това упражнение приеми: 1 KB = 1024 B, 1 MB = 1024 KB. Пресметни: 2 KB = ? B; 3 MB = ? KB; 2048 KB = ? MB. Подреди: 500 B, 2 KB, 1 MB.','Имаш 8 MB свободно място. Колко файла по 2 MB можеш да запишеш?'],['Таблици в текстов документ','Практическа задача','Вмъквай и оформяй таблица.','Създай таблица „Класна библиотека“ с колони: №, Заглавие, Автор, Налични бройки. Попълни пет книги. Оцвети заглавния ред и постави граници.','Добави ред за още една книга и запази документа.']],7:[['Безопасна дигитална следа','Обсъждане и практика','Разпознавай лични данни и подходящо онлайн поведение.','Състави списък от пет правила за безопасно споделяне. За всяко правило дай измислен пример, без реални лични данни.','Оформи правилата като едностраничен плакат.'],['Работа с електронна таблица','Практическа задача','Въвеждай данни и използвай формула за сума.','Създай таблица с колони „Материал“, „Количество“, „Цена“ и „Стойност“. Въведи четири материала за училищен проект. Изчисли стойността чрез умножение и общата сума със SUM.','Оформи цените с два знака след десетичната запетая.']],8:[['Организация на файлове','Практическа задача','Подреждай файлове в смислена структура.','Създай папка „Учебен проект“ с подпапки „Текстове“, „Изображения“ и „Презентация“. Създай кратък текстов документ и го запази в правилната папка.','Обясни защо ясните имена улесняват работата.'],['Презентация с послание','Практическа задача','Представяй идея ясно и кратко.','Направи презентация от четири слайда на тема „Моят дигитален ден“: заглавие, полезни приложения, безопасност и извод. Използвай кратки текстове и четим шрифт.','Представи идеята си за една минута.']],9:[['Прости проверки в C#','Практическа задача','Използвай if и if-else.','Напиши конзолна програма, която прочита две цели числа и извежда по-голямото. Ако са равни, извежда „Числата са равни“.','Провери с двойките: 5 и 9; 12 и 3; 7 и 7.'],['Класове и методи в C#','Практическа задача','Създавай клас с полета и метод.','Създай клас Student с полета Name и Grade и метод PrintInfo(), който ги отпечатва. Създай два обекта и извикай метода за всеки.','Добави конструктор и използвай this за достъп до полетата.']],10:[['Трислоен модел','Задача за проектиране','Разграничавай представяне, бизнес логика и достъп до данни.','За приложение „Библиотека“ разпредели дейностите по слоеве: показване на списък с книги, проверка дали книга е налична, прочитане на записите от хранилището. Обясни избора си.','Добави процеса „Заемане на книга“ и опиши участието на трите слоя.'],['Git: първи локален проект','Практическа задача','Проследявай промени в локално хранилище.','В папка с учебен проект изпълни git init. Създай README.md, добави го с git add README.md и направи запис с git commit -m "Начало на проекта". Разгледай git status и git log.','Промени README.md и направи втори commit. Не включвай пароли или лични данни.']]};
function footer(){return '<footer><span>Фатме Мехмед · ОУ „Христо Ботев“, с. Дъбница</span><span>За любопитни умове · 5.–10. клас</span></footer>'}
function lessonMarkup(l,i,g){return `<details class="lesson"><summary><span class="number">${String(i+1).padStart(2,'0')}</span><span><strong>${l[0]}</strong><small>${l[1]} · примерен материал</small></span></summary><div class="content"><h4>Цел</h4><p>${l[2]}</p><h4>Твоята задача</h4><p>${l[3]}</p><h4>Още една стъпка</h4><p>${l[4]}</p><a class="download" download="zadacha-${g}-${i+1}.txt" href="${URL.createObjectURL(new Blob([g+'. клас\n'+l[0]+'\n\nЦел: '+l[2]+'\n\nЗадача: '+l[3]+'\n\nДопълнително: '+l[4]],{type:'text/plain;charset=utf-8'}))}">↓ Изтегли условието (.txt)</a></div></details>`}
function render(){const g=Number(location.hash.slice(1));document.getElementById('nav').innerHTML=`<button class="${!subjects[g]?'active':''}" onclick="location.hash='home'">⌂ &nbsp; Начало</button>`+Object.keys(subjects).map(n=>`<button class="${g==n?'active':''}" onclick="location.hash='${n}'">${n}. клас <span>↗</span></button>`).join('');const main=document.getElementById('main');if(!subjects[g]){main.innerHTML=`<section class="hero"><div class="hero-art">{ }<br>&lt;/&gt;</div><div class="eyebrow">ОТ ЛЮБОПИТСТВОТО ДО ПЪРВИЯ ПРОЕКТ</div><h1>Твоето място<br>за дигитални открития.</h1><p>Уроци, практически задачи и идеи за работа в час. Избери своя клас и направи следващата стъпка.</p><span class="pill">5.–10. клас</span><span class="pill">Учене чрез практика</span></section><div class="section-head"><h2>Избери своя клас</h2><span class="sub">Шест класа. Много нови възможности.</span></div><div class="grid">${Object.keys(subjects).map(n=>`<a class="class-card" href="#${n}"><span class="grade">${n}</span><h3>${n}. клас</h3><p>${descriptions[n]}</p><div class="card-bottom"><span>2 примерни материала</span><span class="arrow">↗</span></div></a>`).join('')}</div><div class="notice">Начална версия: материалите са примерни и могат да се заменят и допълват с уроците и ресурсите от часовете.</div>${footer()}`;return}main.innerHTML=`<section class="hero"><div class="eyebrow">${subjects[g]}</div><h1>${g}. клас</h1><p>${descriptions[g]} Отвори задача, следвай стъпките и изтегли условието, ако ти е нужно.</p><span class="pill">Практически задачи</span><span class="pill">Ресурси за изтегляне</span></section><div class="section-head"><h2>Учебни материали</h2><input class="search" id="search" type="search" aria-label="Търси материал" placeholder="Търси по тема…"></div><div id="results"></div><div class="notice">Примерни материали за началната версия. Подредбата не представлява пълно годишно разпределение.</div>${footer()}`;const show=()=>{const q=document.getElementById('search').value.toLocaleLowerCase('bg');document.getElementById('results').innerHTML=lessons[g].map((l,i)=>({l,i})).filter(({l})=>l.join(' ').toLocaleLowerCase('bg').includes(q)).map(({l,i})=>lessonMarkup(l,i,g)).join('')||'<div class="empty">Няма материал с това име. Опитай друга дума.</div>'};document.getElementById('search').addEventListener('input',show);show()}
try{if(localStorage.getItem('class-theme')==='dark')document.body.classList.add('dark')}catch{}document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');try{localStorage.setItem('class-theme',document.body.classList.contains('dark')?'dark':'light')}catch{}};addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></html>
