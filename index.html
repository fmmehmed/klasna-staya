const lessons={5:[['Машината компютър','Основни устройства и тяхното предназначение','Посочи входни, изходни и запаметяващи устройства.','Направи таблица с три колони: устройство, вид и предназначение. Включи клавиатура, мишка, монитор, принтер и флаш памет.','Добави още две устройства и обясни за какво ги използваш.'],['История в Scratch','Последователност от команди','Създай кратка анимация с начало и край.','Избери фон и два героя. При натискане на зеленото знаме първият герой поздравява, а вторият отговаря след изчакване.','Добави движение и промяна на костюм.']],6:[['Информация и мерни единици','Упражнение','Сравнявай обеми на файлове и преобразувай мерни единици.','За това упражнение приеми: 1 KB = 1024 B, 1 MB = 1024 KB. Пресметни: 2 KB = ? B; 3 MB = ? KB; 2048 KB = ? MB. Подреди: 500 B, 2 KB, 1 MB.','Имаш 8 MB свободно място. Колко файла по 2 MB можеш да запишеш?'],['Таблици в текстов документ','Практическа задача','Вмъквай и оформяй таблица.','Създай таблица „Класна библиотека“ с колони: №, Заглавие, Автор, Налични бройки. Попълни пет книги. Оцвети заглавния ред и постави граници.','Добави ред за още една книга и запази документа.']],7:[['Безопасна дигитална следа','Обсъждане и практика','Разпознавай лични данни и подходящо онлайн поведение.','Състави списък от пет правила за безопасно споделяне. За всяко правило дай измислен пример, без реални лични данни.','Оформи правилата като едностраничен плакат.'],['Работа с електронна таблица','Практическа задача','Въвеждай данни и използвай формула за сума.','Създай таблица с колони „Материал“, „Количество“, „Цена“ и „Стойност“. Въведи четири материала за училищен проект. Изчисли стойността чрез умножение и общата сума със SUM.','Оформи цените с два знака след десетичната запетая.']],8:[['Организация на файлове','Практическа задача','Подреждай файлове в смислена структура.','Създай папка „Учебен проект“ с подпапки „Текстове“, „Изображения“ и „Презентация“. Създай кратък текстов документ и го запази в правилната папка.','Обясни защо ясните имена улесняват работата.'],['Презентация с послание','Практическа задача','Представяй идея ясно и кратко.','Направи презентация от четири слайда на тема „Моят дигитален ден“: заглавие, полезни приложения, безопасност и извод. Използвай кратки текстове и четим шрифт.','Представи идеята си за една минута.']],9:[['Прости проверки в C#','Практическа задача','Използвай if и if-else.','Напиши конзолна програма, която прочита две цели числа и извежда по-голямото. Ако са равни, извежда „Числата са равни“.','Провери с двойките: 5 и 9; 12 и 3; 7 и 7.'],['Класове и методи в C#','Практическа задача','Създавай клас с полета и метод.','Създай клас Student с полета Name и Grade и метод PrintInfo(), който ги отпечатва. Създай два обекта и извикай метода за всеки.','Добави конструктор и използвай this за достъп до полетата.']],10:[['Трислоен модел','Задача за проектиране','Разграничавай представяне, бизнес логика и достъп до данни.','За приложение „Библиотека“ разпредели дейностите по слоеве: показване на списък с книги, проверка дали книга е налична, прочитане на записите от хранилището. Обясни избора си.','Добави процеса „Заемане на книга“ и опиши участието на трите слоя.'],['Git: първи локален проект','Практическа задача','Проследявай промени в локално хранилище.','В папка с учебен проект изпълни git init. Създай README.md, добави го с git add README.md и направи запис с git commit -m "Начало на проекта". Разгледай git status и git log.','Промени README.md и направи втори commit. Не включвай пароли или лични данни.']]};

function lessonMarkup(l,i,g){return `<details class="lesson"><summary><span class="number">${String(i+1).padStart(2,'0')}</span><span><strong>${l[0]}</strong><small>${l[1]} · примерен материал</small></span></summary><div class="content"><h4>Цел</h4><p>${l[2]}</p><h4>Твоята задача</h4><p>${l[3]}</p><h4>Още една стъпка</h4><p>${l[4]}</p><a class="download" download="zadacha-${g}-${i+1}.txt" href="${URL.createObjectURL(new Blob([g+'. клас\n'+l[0]+'\n\nЦел: '+l[2]+'\n\nЗадача: '+l[3]+'\n\nДопълнително: '+l[4]],{type:'text/plain;charset=utf-8'}))}">↓ Изтегли условието (.txt)</a></div></details>`}
function render(){const g=Number(location.hash.slice(1));document.getElementById('nav').innerHTML=`<button class="${!subjects[g]?'active':''}" onclick="location.hash='home'">⌂ &nbsp; Начало</button>`+Object.keys(subjects).map(n=>`<button class="${g==n?'active':''}" onclick="location.hash='${n}'">${n}. клас <span>↗</span></button>`).join('');const main=document.getElementById('main');if(!subjects[g]){main.innerHTML=`<section class="hero"><div class="hero-art">{ }<br>&lt;/&gt;</div><div class="eyebrow">ОТ ЛЮБОПИТСТВОТО ДО ПЪРВИЯ ПРОЕКТ</div><h1>Твоето място<br>за дигитални открития.</h1><p>Уроци, практически задачи и идеи за работа в час. Избери своя клас и направи следващата стъпка.</p><span class="pill">5.–10. клас</span><span class="pill">Учене чрез практика</span></section><div class="section-head"><h2>Избери своя клас</h2><span class="sub">Шест класа. Много нови възможности.</span></div><div class="grid">${Object.keys(subjects).map(n=>`<a class="class-card" href="#${n}"><span class="grade">${n}</span><h3>${n}. клас</h3><p>${descriptions[n]}</p><div class="card-bottom"><span>2 задачи · 1 игра</span><span class="arrow">↗</span></div></a>`).join('')}</div><div class="notice">Начална версия: материалите са примерни и могат да се заменят и допълват с уроците и ресурсите от часовете.</div>${footer()}`;return}main.innerHTML=`<section class="hero"><div class="eyebrow">${subjects[g]}</div><h1>${g}. клас</h1><p>${descriptions[g]} Отвори задача, следвай стъпките и изтегли условието, ако ти е нужно.</p><span class="pill">Практически задачи</span><span class="pill">Ресурси за изтегляне</span></section><div class="section-head"><h2>Учебни материали</h2><input class="search" id="search" type="search" aria-label="Търси материал" placeholder="Търси по тема…"></div><div id="results"></div><div class="notice">Примерни материали за началната версия. Подредбата не представлява пълно годишно разпределение.</div>${footer()}`;const show=()=>{const q=document.getElementById('search').value.toLocaleLowerCase('bg');document.getElementById('results').innerHTML=lessons[g].map((l,i)=>({l,i})).filter(({l})=>l.join(' ').toLocaleLowerCase('bg').includes(q)).map(({l,i})=>lessonMarkup(l,i,g)).join('')||'<div class="empty">Няма материал с това име. Опитай друга дума.</div>'};document.getElementById('search').addEventListener('input',show);show()}
try{if(localStorage.getItem('class-theme')==='dark')document.body.classList.add('dark')}catch{}document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');try{localStorage.setItem('class-theme',document.body.classList.contains('dark')?'dark':'light')}catch{}};addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();

r(--soft);padding:14px;border-radius:12px;overflow-wrap:anywhere;letter-spacing:5px;font-size:22px;margin:14px 0}.pixel-board{display:grid;grid-template-columns:repeat(8,1fr);max-width:360px;border:1px solid #999}.pixel-board button,.pixel-board span{display:block;aspect-ratio:1;min-width:0;padding:0;border:1px solid #b9bdc6;border-radius:0}.pixel-board button:focus-visible{outline:3px solid #7052c6;outline-offset:-3px}.palette{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.palette button{width:40px;height:40px;border:2px solid #777;border-radius:10px}.palette button[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:3px}.lab-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.lab-status{min-height:65px}.home-note{margin-top:30px;font-size:13px}.dark .hero{background:#30264b}.dark .robot-cell.wall{background:#6d7180}.dark .robot-cell.goal{background:#3e6436}body.dark{background:var(--bg)}@media(max-width:1150px){.grid,.games-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-symbol{font-size:65px}}@media(max-width:750px){.shell{display:block;padding:18px}.hero-symbol{display:none}.hero{padding:25px}.home-kicker{display:block}.home-kicker span{display:block;margin:8px 0}.lab-layout{grid-template-columns:1fr}.games-grid{grid-template-columns:1fr}.grid{gap:12px}.class-card{padding:17px;min-height:230px}nav{display:flex;overflow:auto}aside{position:static}.hero h1{letter-spacing:-1px}}`;

function foot(){return '<footer><span>Дигитална класна стая · Учене чрез игра</span><span>Компютърно моделиране · КМИТ · ИТ · Програмиране</span></footer>'}
footer=foot;
function navigation(route){document.getElementById('nav').innerHTML='<button onclick="location.hash=\'home\'" class="'+(route==='home'||!route?'active':'')+'">⌂ Начало</button>'+grades.map(g=>`<button class="${route===String(g)?'active':''}" onclick="location.hash='${g}'">${g}. клас <span>↗</span></button>`).join('')+`<button onclick="location.hash='games'" class="${route==='games'?'active':''}">🎮 Всички игри</button><button onclick="location.hash='missions'" class="${route==='missions'?'active':''}">🧭 Мисии</button>`;document.querySelector('.sub').textContent='Компютърно моделиране · КМИТ · ИТ';}
function labCards(g){return '<div class="games-grid">'+labs.map(l=>`<article class="game-card"><span class="game-icon">${l[1]}</span><div class="eyebrow">${g}. КЛАС · КОМПЮТЪРНО МОДЕЛИРАНЕ</div><h3>${l[2]}</h3><p>${l[3]}</p><a class="play-link" href="#junior-${g}-${l[0]}">Играй →</a></article>`).join('')+'</div>'}
function home(){document.getElementById('main').innerHTML=`<div class="home-kicker"><span>ДИГИТАЛНА КЛАСНА СТАЯ</span><span>ИНТЕРАКТИВНИ РЕСУРСИ · 3.–10. КЛАС</span></div><section class="hero"><div class="hero-symbol" aria-hidden="true">{ ✦ }</div><div class="eyebrow">МАЛКИ СТЪПКИ. ГОЛЕМИ ОТКРИТИЯ.</div><h1>Знанието оживява,<br>когато играем.</h1><p>Програмирай робот, реши дигитална загадка или създай свой проект. Избери клас и се впусни в следващото приключение.</p><div class="feature-strip"><span>🎮 Игри в браузъра</span><span>🧩 Практически задачи</span><span>✨ Без регистрация</span></div></section><div class="section-head"><h2>Избери своя свят</h2><span class="sub">Осем класа. Различни приключения.</span></div><div class="grid">${grades.map((g,i)=>`<a class="class-card" href="#${g}" style="--tile:${colors[i]}"><span class="grade">${g}</span><h3>${g}. клас</h3><p>${g<5?'Компютърно моделиране':subjects[g]}</p><div class="card-bottom"><span>${g<5?'3 интерактивни игри':g===5?'52 занятия · 8 работилници':'Игри · мисии · задачи'}</span><span class="arrow">↗</span></div></a>`).join('')}</div><div class="quick-links"><a href="#games">🎮 Всички интерактивни игри →</a><a href="#missions">🧭 Сюжетни учебни мисии →</a><a href="https://fmmehmed.github.io/Games/" target="_blank" rel="noopener">🔤 Бесеница и още игри ↗</a></div><div class="section-head"><h2>Първи стъпки в програмирането</h2><span class="sub">Ново за 3. и 4. клас</span></div>${labCards(3)}<p class="home-note">Материалите са разработени с помощта на AI и подлежат на учителска проверка. Сайтът се допълва постепенно; разделите не са пълна учебна програма.</p>${foot()}`;}
function junior(g){document.getElementById('main').innerHTML=`<section class="hero"><div class="eyebrow">${g}. КЛАС · КОМПЮТЪРНО МОДЕЛИРАНЕ</div><h1>${g===3?'Първата ти програма.<br>Първото приключение.':'Мисли. Повтаряй.<br>Създавай.'}</h1><p>${g===3?'Открий как компютърът изпълнява точни команди. Подреждай действия, движи робот и рисувай с пиксели.':'Използвай повторения, тествай алгоритми и откривай грешки. Всеки опит е стъпка към работеща програма.'}</p><span class="pill">3 игри с обратна връзка</span><span class="pill">Работи с мишка и клавиатура</span></section><div class="section-head"><h2>Избери занимание</h2></div>${labCards(g)}<div class="learn-note"><strong>След играта — създай в Scratch</strong><p>${g===3?'Избери герой и фон. При натискане на зеленото знаме героят казва „Здравей!“, премества се и сменя костюма си.':'Направи герой, който повтаря четири пъти движение и смяна на костюм. Сравни програмата с и без блок за повторение.'}</p></div><p class="game-help">Това са начални упражнения, а не пълно покритие на учебната програма.</p>${foot()}`;}
function frame(g,title,desc){document.getElementById('main').innerHTML=`<a href="#${g}">← Към ${g}. клас</a><section class="hero" style="margin-top:20px"><div class="eyebrow">${g}. КЛАС · КОМПЮТЪРНО МОДЕЛИРАНЕ</div><h1>${title}</h1><p>${desc}</p></section><section class="game-box" id="junior-box"></section>${foot()}`;return document.getElementById('junior-box');}
// Pure interpreter: directions are absolute, wall/edge collisions stop execution.
function simulate(commands,walls){let x=0,y=4;const path=[[x,y]];for(const c of commands){const d={R:[1,0],L:[-1,0],U:[0,-1],D:[0,1]}[c];if(!d)return {x,y,path,error:true};const nx=x+d[0],ny=y+d[1];if(nx<0||nx>4||ny<0||ny>4||walls.includes(ny*5+nx))return {x,y,path,error:true};x=nx;y=ny;path.push([x,y]);}return {x,y,path,error:false};}
function robot(g){const box=frame(g,'🤖 Програмирай Роби','Отведи Роби от долния ляв ъгъл до звездата горе вдясно. Стрелките задават посоки по екрана. Сивите клетки са препятствия.');let commands=[],level=0;const wallsList=g===3?[[12],[6,7,17],[11,12,13]]:[[11,12,13],[6,8,16,18],[7,12,17]];function draw(){const walls=wallsList[level];box.innerHTML=`<div class="eyebrow">ПРЕДИЗВИКАТЕЛСТВО ${level+1} ОТ 3</div><div class="lab-layout"><div><div class="robot-board" id="robot-board" aria-label="Поле 5 на 5">${Array.from({length:25},(_,i)=>`<div class="robot-cell ${walls.includes(i)?'wall':''} ${i===4?'goal':''}" data-cell="${i}">${i===20?'🤖':i===4?'⭐':walls.includes(i)?'▧':''}</div>`).join('')}</div></div><div><h2>Твоята програма</h2><p>Един блок премества Роби с една клетка.</p><div class="choices">${[['U','↑ Нагоре'],['R','→ Надясно'],['D','↓ Надолу'],['L','← Наляво']].map(([c,t])=>`<button class="choice" data-command="${c}">${t}</button>`).join('')}</div>${g===4?'<div class="lab-actions"><label>Повтори <input id="repeat-count" type="number" min="2" max="4" value="2" style="width:55px"> пъти</label><button class="choice" id="repeat">последната команда</button></div><p class="game-help">Повторението добавя копия на последната команда към програмата.</p>':''}<div class="command-list" id="commands" aria-live="polite">Добави команди…</div><div class="lab-actions"><button class="action" id="run">▶ Изпълни</button><button class="icon" id="undo">↶ Изтрий последната</button><button class="icon" id="clear">Нова програма</button></div></div></div><div class="feedback lab-status" id="robot-feedback" aria-live="polite">Първо планирай маршрута. Можеш да променяш програмата си.</div><button class="action" id="robot-next" hidden>${level<2?'Следващо поле →':'Играй отначало ↻'}</button>`;
const status=document.getElementById('robot-feedback'),next=document.getElementById('robot-next');function changed(){document.getElementById('commands').textContent=commands.map(c=>({R:'→',L:'←',U:'↑',D:'↓'}[c])).join(' ')||'Добави команди…';next.hidden=true;status.className='feedback';status.textContent='Програмата е променена. Натисни „Изпълни“.';}box.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>{if(commands.length<40)commands.push(b.dataset.command);changed()});document.getElementById('undo').onclick=()=>{commands.pop();changed()};document.getElementById('clear').onclick=()=>{commands=[];draw()};if(g===4)document.getElementById('repeat').onclick=()=>{const n=Number(document.getElementById('repeat-count').value);if(!commands.length||!Number.isInteger(n)||n<2||n>4){status.textContent='Добави команда и избери цяло число от 2 до 4.';return}const last=commands.at(-1);for(let i=1;i<n&&commands.length<40;i++)commands.push(last);changed()};document.getElementById('run').onclick=()=>{const r=simulate(commands,walls);box.querySelectorAll('[data-cell]').forEach(el=>{const i=Number(el.dataset.cell);el.textContent=i===r.y*5+r.x?'🤖':i===4?'⭐':walls.includes(i)?'▧':r.path.some(([x,y])=>y*5+x===i)?'·':''});const ok=!r.error&&r.x===4&&r.y===0;status.className='feedback '+(ok?'good':'bad');status.textContent=ok?'✓ Роби стигна до звездата! Програмата ти работи.':r.error?'Роби спря пред препятствие или край на полето. Промени командите и опитай отново.':'Роби още не е при звездата. Добави или поправи командите.';next.hidden=!ok;};next.onclick=()=>{level=(level+1)%3;commands=[];draw()};}draw();}
function sequence(g){const box=frame(g,'🧩 Подреди историята','Премествай блоковете с бутоните ↑ и ↓. След това провери дали редът следва зададения план.');const tasks=g===3?[
['Героят поздравява, тръгва и накрая се сбогува.',['Когато е щракнато зеленото знаме','Кажи „Здравей!“ за 2 секунди','Премести се 50 стъпки','Кажи „Довиждане!“ за 2 секунди']],
['Първо се покажи, после танцувай и накрая се скрий.',['Когато е щракнато зеленото знаме','Покажи се','Смени костюма','Скрий се']],
['Първо избери сцена, поздрави и се завърти.',['Когато е щракнато зеленото знаме','Смени фона с „Парк“','Кажи „Здравей, парк!“','Завърти се с 90 градуса']]
]:[
['Нулирай точките, повтори движение 4 пъти и обяви края.',['Когато е щракнато зеленото знаме','Задай точки на 0','Повтори 4 пъти: премести се 20 стъпки','Кажи „Готово!“']],
['Задай стартова позиция, задай посока и изпълни повторение.',['Когато е щракнато зеленото знаме','Отиди на x: 0 y: 0','Обърни се в посока 90','Повтори 3 пъти: премести се 30 стъпки']],
['Попитай за име, изчакай отговор и поздрави с него.',['Когато е щракнато зеленото знаме','Попитай „Как се казваш?“ и изчакай','Задай име на отговор','Кажи: обедини „Здравей, “ и име']]
];let level=0,order=[3,1,0,2];function draw(){const [goal,steps]=tasks[level];box.innerHTML=`<div class="eyebrow">ИСТОРИЯ ${level+1} ОТ 3</div><h2>${goal}</h2><ol class="order-list">${order.map((v,i)=>`<li><span>${steps[v]}</span><span class="move-buttons"><button data-move="${i}" data-d="-1" aria-label="Премести блок ${i+1} нагоре" ${i===0?'disabled':''}>↑</button><button data-move="${i}" data-d="1" aria-label="Премести блок ${i+1} надолу" ${i===3?'disabled':''}>↓</button></span></li>`).join('')}</ol><div class="feedback" id="sequence-feedback" aria-live="polite">Кое трябва да се случи първо?</div><button class="action" id="sequence-check">Провери алгоритъма</button> <button class="action" id="sequence-next" hidden>${level<2?'Следваща история →':'Играй отначало ↻'}</button>`;box.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const a=Number(b.dataset.move),c=a+Number(b.dataset.d);[order[a],order[c]]=[order[c],order[a]];draw()});document.getElementById('sequence-check').onclick=()=>{const ok=order.every((v,i)=>v===i),f=document.getElementById('sequence-feedback');f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'✓ Алгоритъмът следва плана! Обясни на съученик какво ще направи героят.':'Още има разменени стъпки. Започни със събитието и проследи плана.';document.getElementById('sequence-next').hidden=!ok};document.getElementById('sequence-next').onclick=()=>{level=(level+1)%3;order=[3,1,0,2];draw()};}draw();}
function pixels(g){const box=frame(g,'🎨 Пикселна работилница','Избери цвят и оцветявай клетките вдясно. Пресъздай модела вляво. Бялото също е цвят и служи за изтриване.');const palette=['#ffffff','#7250bd','#e75c82','#f5be39','#26a18d'];const names=['Бяло','Лилаво','Розово','Жълто','Зелено'];const patterns=g===3?[
['00000000','00100100','01111110','11111111','11111111','01111110','00111100','00011000'],
['00000000','00011000','00111100','01111110','11111111','00111100','00111100','00000000']
]:[
['00000000','00044000','00444400','04444440','44444444','00022000','00022000','00000000'],
['00000000','00400400','04444440','04244240','04444440','00422400','04000040','00000000']
];let level=0,paint=1,cells=Array(64).fill(0);function draw(){const target=patterns[level].join('').split('').map(Number);box.innerHTML=`<div class="eyebrow">МОДЕЛ ${level+1} ОТ 2</div><div class="palette" aria-label="Палитра">${palette.map((c,i)=>`<button style="background:${c}" data-color="${i}" aria-label="${names[i]}" aria-pressed="${i===paint}"></button>`).join('')}</div><div class="lab-layout"><div><h2>Модел</h2><div class="pixel-board" aria-label="Образец 8 на 8">${target.map(v=>`<span style="background:${palette[v]}" role="img" aria-label="${names[v]}"></span>`).join('')}</div></div><div><h2>Твоята рисунка</h2><div class="pixel-board">${cells.map((v,i)=>`<button data-pixel="${i}" style="background:${palette[v]}" aria-label="Ред ${Math.floor(i/8)+1}, колона ${i%8+1}: ${names[v]}"></button>`).join('')}</div></div></div><div class="feedback" id="pixel-feedback" aria-live="polite">Избери цвят от палитрата.</div><div class="lab-actions"><button class="action" id="pixel-check">Провери рисунката</button><button class="icon" id="pixel-clear">Изчисти</button><button class="action" id="pixel-next" hidden>${level===0?'Следващ модел →':'Играй отначало ↻'}</button></div>`;box.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{paint=Number(b.dataset.color);box.querySelectorAll('[data-color]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)))});box.querySelectorAll('[data-pixel]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.pixel);cells[i]=paint;b.style.background=palette[paint];b.setAttribute('aria-label',`Ред ${Math.floor(i/8)+1}, колона ${i%8+1}: ${names[paint]}`);document.getElementById('pixel-next').hidden=true;document.getElementById('pixel-feedback').textContent='Рисунката е променена. Провери отново.';});document.getElementById('pixel-check').onclick=()=>{const n=cells.filter((v,i)=>v===target[i]).length,f=document.getElementById('pixel-feedback');f.className='feedback '+(n===64?'good':'bad');f.textContent=n===64?'✓ Всички пиксели съвпадат! Създаде дигитална рисунка.':`Съвпадат ${n} от 64 клетки, включително белите. Сравни редовете с образеца.`;document.getElementById('pixel-next').hidden=n!==64};document.getElementById('pixel-clear').onclick=()=>{cells=Array(64).fill(0);draw()};document.getElementById('pixel-next').onclick=()=>{level=(level+1)%2;cells=Array(64).fill(0);draw()};}draw();}
const previousRender=render;render=function(){const r=location.hash.slice(1),m=r.match(/^junior-([34])-(robot|sequence|pixels)$/);if(!r||r==='home')home();else if(r==='3'||r==='4')junior(Number(r));else if(m)({robot,sequence,pixels}[m[2]])(Number(m[1]));else if(r==='games'){document.getElementById('main').innerHTML=`<section class="hero"><div class="eyebrow">ИНТЕРАКТИВНИ ЗАНИМАНИЯ · 3.–10. КЛАС</div><h1>Избери. Опитай.<br>Открий решението.</h1><p>Команди за робот, пикселни рисунки, дигитални загадки и програмен код. Всяка игра дава обратна връзка.</p></section><div class="section-head"><h2>3. клас · Първи стъпки</h2></div>${labCards(3)}<div class="section-head"><h2>4. клас · Следващо ниво</h2></div>${labCards(4)}<div class="section-head"><h2>5.–10. клас · Дигитални предизвикателства</h2></div>${gamesCards()}<div class="quick-links"><a href="https://fmmehmed.github.io/Games/" target="_blank" rel="noopener">🔤 Отвори бесеницата и другите игри ↗</a></div>${foot()}`;}else previousRender();navigation(r);};render();
})();
